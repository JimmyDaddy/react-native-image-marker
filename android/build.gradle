def detectReactNativeVersion() {
  try {
    // Try to read from package.json in root project
    def packageJsonFile = file("../package.json")
    if (packageJsonFile.exists()) {
      def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
      def rnVersion = packageJson.dependencies?.get("react-native") ?: packageJson.devDependencies?.get("react-native")
      if (rnVersion) {
        return normalizeVersion(rnVersion)
      }
    }
    
    // Try to read from node_modules/react-native/package.json
    def rnPackageJsonFile = file("../node_modules/react-native/package.json")
    if (rnPackageJsonFile.exists()) {
      def rnPackageJson = new groovy.json.JsonSlurper().parseText(rnPackageJsonFile.text)
      return normalizeVersion(rnPackageJson.version)
    }
    
    // Default fallback
    return "0.73.0"
  } catch (Exception e) {
    println "Warning: Failed to detect React Native version: ${e.message}"
    return "0.73.0"
  }
}

def normalizeVersion(version) {
  // Remove common prefixes like ^, ~, >=, etc.
  def cleanVersion = version.replaceAll(/^[\^~>=<]+/, '')
  
  // Extract major.minor.patch format
  def versionMatch = cleanVersion =~ /(\d+\.\d+\.\d+)/
  if (versionMatch) {
    return versionMatch[0][1]
  }
  
  // Extract major.minor format and add .0
  def shortVersionMatch = cleanVersion =~ /(\d+\.\d+)/
  if (shortVersionMatch) {
    return "${shortVersionMatch[0][1]}.0"
  }
  
  return cleanVersion
}

def getGradlePluginVersionForRN(rnVersion) {
  if (rnVersion.startsWith("0.73")) {
    return "8.1.0"
  } else if (rnVersion.startsWith("0.81")) {
    return "8.3.0"
  } else if (rnVersion.startsWith("0.8")) {
    return "8.4.0"
  } else {
    return "8.1.0" // Default fallback
  }
}

def getKotlinVersionForRN(rnVersion) {
  if (rnVersion.startsWith("0.73")) {
    return "1.8.0"
  } else if (rnVersion.startsWith("0.81")) {
    return "1.9.0"
  } else if (rnVersion.startsWith("0.8")) {
    return "1.9.22"
  } else {
    return "1.8.0" // Default fallback
  }
}

def shouldUseCodegenInBuildGradle(rnVersion) {
  // For React Native 0.81+ and 0.8x, codegenConfig should be in build.gradle
  // For React Native 0.73, codegenConfig should be in package.json
  return rnVersion.startsWith("0.81") || rnVersion.startsWith("0.8")
}

buildscript {
  // Try to get Kotlin version from root project first (from example app)
  // This ensures compatibility with the host app's Kotlin version
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? 
    rootProject.ext.get("kotlinVersion") : 
    (project.hasProperty("kotlin_version") ? 
      project.properties["kotlin_version"] : 
      project.properties["ImageMarker_kotlinVersion"])
  
  repositories {
    google()
    mavenCentral()
  }

  // Inline version detection for buildscript
  def gradlePluginVersion = "8.1.0" // Default safe version
  try {
    def packageJsonFile = file("../package.json")
    if (packageJsonFile.exists()) {
      def packageJson = new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
      def rnVersion = packageJson.dependencies?.get("react-native") ?: packageJson.devDependencies?.get("react-native")
      if (rnVersion) {
        def cleanVersion = rnVersion.replaceAll(/^[\^~>=<]+/, '')
        if (cleanVersion.startsWith("0.81")) {
          gradlePluginVersion = "8.3.0"
        } else if (cleanVersion.startsWith("0.8")) {
          gradlePluginVersion = "8.4.0"
        }
      }
    }
  } catch (Exception e) {
    println "Warning: Failed to detect React Native version in buildscript, using default Gradle plugin version"
  }

  dependencies {
    classpath "com.android.tools.build:gradle:$gradlePluginVersion"
    if (kotlin_version) {
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def appProject = rootProject.allprojects.find { it.plugins.hasPlugin('com.android.application') }
def reactNativeVersion = detectReactNativeVersion()

// Only apply React plugin if we're in New Architecture mode AND in a React Native app context
// This prevents autolinking from detecting Codegen configuration in Legacy mode
if (isNewArchitectureEnabled() && appProject != null) {
  try {
    apply plugin: "com.facebook.react"
  } catch (Exception e) {
    println "Warning: Could not apply com.facebook.react plugin: ${e.message}"
  }
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["ImageMarker_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ImageMarker_" + name]).toInteger()
}

android {
  // Add namespace for Android Gradle Plugin 8.x compatibility
  namespace "com.jimmydaddy.imagemarker"
  
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  buildFeatures {
    buildConfig true
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    
    if (isNewArchitectureEnabled()) {
      externalNativeBuild {
        ndkBuild {
          arguments "APP_PLATFORM=android-21",
                    "APP_STL=c++_shared",
                    "NDK_TOOLCHAIN_VERSION=clang"
          cppFlags "-std=c++17"
        }
      }
    }
  }
  
  buildTypes {
    release {
      minifyEnabled false
    }
    debug {
      debuggable true
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  if (isNewArchitectureEnabled()) {
    sourceSets {
      main {
        java {
          srcDirs += [
            "src/newarch/java",
            "${project.buildDir}/generated/source/codegen/java"
          ]
        }
      }
    }
    
    // Ensure codegen output directory exists
    task ensureCodegenDir {
      doLast {
        def codegenDir = file("${project.buildDir}/generated/source/codegen/java")
        if (!codegenDir.exists()) {
          codegenDir.mkdirs()
        }
      }
    }
    
    preBuild.dependsOn ensureCodegenDir
  } else {
    sourceSets {
      main {
        java {
          srcDirs += ["src/oldarch/java"]
        }
      }
    }
    
    // In Legacy mode, create empty Codegen directories to satisfy autolinking
    // Autolinking detects codegenConfig in package.json and expects these directories to exist
    // even when not building with New Architecture
    task createEmptyCodegenDirs {
      doLast {
        // Create empty Java codegen directory
        def javaCodegenDir = file("${project.buildDir}/generated/source/codegen/java")
        if (!javaCodegenDir.exists()) {
          javaCodegenDir.mkdirs()
          println "Created empty Java codegen directory for Legacy Architecture: ${javaCodegenDir}"
        }
        
        // Create empty JNI codegen directory to prevent CMake errors
        def jniCodegenDir = file("${project.buildDir}/generated/source/codegen/jni")
        if (!jniCodegenDir.exists()) {
          jniCodegenDir.mkdirs()
          
          // Create a minimal CMakeLists.txt with a STATIC library (not INTERFACE)
          def cmakeFile = new File(jniCodegenDir, "CMakeLists.txt")
          cmakeFile.text = """# Empty CMakeLists.txt for Legacy Architecture
# This file is created to satisfy autolinking requirements
# when codegenConfig exists in package.json but New Architecture is disabled

cmake_minimum_required(VERSION 3.13)
project(react_codegen_RNImageMarkerSpec)

# Create a dummy source file for the static library
set(DUMMY_SOURCE_FILE "\${CMAKE_CURRENT_BINARY_DIR}/dummy.cpp")
file(WRITE "\${DUMMY_SOURCE_FILE}" "// Dummy file for Legacy Architecture\\n")

# Create a static library target (not INTERFACE) to satisfy autolinking
add_library(react_codegen_RNImageMarkerSpec STATIC "\${DUMMY_SOURCE_FILE}")

# Set minimal properties
target_include_directories(react_codegen_RNImageMarkerSpec PUBLIC .)
"""
          
          // Create an empty header file to satisfy #include directives
          def headerFile = new File(jniCodegenDir, "RNImageMarkerSpec.h")
          headerFile.text = """// Empty header file for Legacy Architecture
// This file is created to satisfy autolinking requirements
// when codegenConfig exists in package.json but New Architecture is disabled

#ifndef RNIMAGEMARKERSPE_H
#define RNIMAGEMARKERSPE_H

#include <memory>
#include <string>

// Forward declarations for React Native types
namespace facebook {
namespace react {
class TurboModule;
class JavaTurboModule;
} // namespace react
} // namespace facebook

// Stub function declaration to satisfy autolinking
// In Legacy mode, this function will never be called
inline std::shared_ptr<facebook::react::TurboModule> RNImageMarkerSpec_ModuleProvider(
    const std::string &moduleName,
    const facebook::react::JavaTurboModule::InitParams &params) {
  // Return nullptr - this should never be called in Legacy mode
  return nullptr;
}

#endif // RNIMAGEMARKERSPE_H
"""
          
          println "Created empty JNI codegen directory with CMakeLists.txt and header for Legacy Architecture: ${jniCodegenDir}"
        }
      }
    }
    
    // Run before preBuild to ensure directories exist before autolinking runs
    preBuild.dependsOn createEmptyCodegenDirs
    
    // Also ensure directories exist before CMake configuration
    afterEvaluate {
      tasks.matching { it.name.startsWith('configureCMake') }.all {
        dependsOn createEmptyCodegenDirs
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

// Use Kotlin version from root project if available, otherwise use version based on RN version
def kotlin_version = rootProject.ext.has("kotlinVersion") ? 
  rootProject.ext.get("kotlinVersion") : 
  (project.hasProperty("kotlin_version") ? 
    project.properties["kotlin_version"] : 
    getKotlinVersionForRN(reactNativeVersion))

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.0"
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  
  // Image processing dependencies
  implementation "io.coil-kt:coil:2.5.0"
  implementation "io.coil-kt:coil-svg:2.5.0"
  implementation "io.coil-kt:coil-gif:2.5.0"
  
  // New Architecture dependencies
  if (isNewArchitectureEnabled()) {
    implementation "com.facebook.react:react-android"
    implementation "com.facebook.react:hermes-android"
    implementation "androidx.annotation:annotation:1.6.0"
  }
  
  // Test dependencies
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
  testImplementation "org.mockito:mockito-core:3.+"
}

if (isNewArchitectureEnabled() && appProject != null) {
  try {
    apply plugin: "com.facebook.react"
    
    react {
      // Point to the directory containing the spec files
      jsRootDir = file("../")
      libraryName = "ImageMarker"
      codegenJavaPackageName = "com.jimmydaddy.imagemarker"
      
      // Configure codegenConfig based on React Native version
      if (shouldUseCodegenInBuildGradle(reactNativeVersion)) {
        // For React Native 0.81+ and 0.8x, configure codegenConfig in build.gradle
        codegenConfig = [
          name: "RNImageMarkerSpec",
          type: "modules",
          jsSrcsDir: "specs",
          android: [
            javaPackageName: "com.jimmydaddy.imagemarker"
          ]
        ]
        println "Configured Codegen for React Native ${reactNativeVersion} with jsSrcsDir: specs"
      } else {
        // For React Native 0.73, codegenConfig should be in package.json
        // The react block will automatically pick up the configuration from package.json
        println "Using codegenConfig from package.json for React Native ${reactNativeVersion}"
      }
    }
  } catch (Exception e) {
    println "Warning: Could not configure React plugin: ${e.message}"
  }
}

