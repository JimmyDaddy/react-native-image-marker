name: Publish npm package

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

jobs:
  resolve:
    name: Resolve and verify release target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      package_name: ${{ steps.target.outputs.package_name }}
      package_path: ${{ steps.target.outputs.package_path }}
      version: ${{ steps.target.outputs.version }}
      branch: ${{ steps.target.outputs.branch }}
      npm_tag: ${{ steps.target.outputs.npm_tag }}
      additional_dist_tags: ${{ steps.target.outputs.additional_dist_tags }}
      channel: ${{ steps.target.outputs.channel }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Resolve release target
        id: target
        run: >-
          node scripts/resolve-release-target.mjs
          --tag "${{ github.event.release.tag_name || inputs.tag }}"
          --github-output "$GITHUB_OUTPUT"

      - name: Fetch protected release branch
        run: git fetch origin "${{ steps.target.outputs.branch }}"

      - name: Verify package version and release provenance
        run: >-
          node scripts/verify-release-target.mjs
          --tag "${{ steps.target.outputs.tag }}"

  publish:
    name: Publish ${{ needs.resolve.outputs.package_name }}@${{ needs.resolve.outputs.version }}
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout the verified release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Use the trusted-publishing npm CLI
        run: npm install --global npm@12.0.1

      - name: Install release dependencies
        run: npm ci

      - name: Build Recipe workspace dependency
        if: needs.resolve.outputs.package_path == 'packages/editor' || needs.resolve.outputs.package_path == 'packages/node' || needs.resolve.outputs.package_path == 'packages/cli'
        run: npm run build:recipe

      - name: Build Core type dependency for Editor
        if: needs.resolve.outputs.package_path == 'packages/editor'
        run: npm run prepack

      - name: Build Node dependency for CLI
        if: needs.resolve.outputs.package_path == 'packages/cli'
        run: npm run build:node

      - name: Build package
        working-directory: ${{ needs.resolve.outputs.package_path }}
        run: npm run prepack

      - name: Check whether the exact version is already published
        id: registry
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json --prefer-online >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already public; continuing with verification."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with provenance
        if: steps.registry.outputs.published != 'true'
        working-directory: ${{ needs.resolve.outputs.package_path }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm publish
          --provenance
          --access public
          --tag "${{ needs.resolve.outputs.npm_tag }}"

      - name: Add maintenance dist-tags
        if: needs.resolve.outputs.additional_dist_tags != ''
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
          ADDITIONAL_DIST_TAGS: ${{ needs.resolve.outputs.additional_dist_tags }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required for post-publish maintenance dist-tags."
            exit 1
          fi
          for dist_tag in ${ADDITIONAL_DIST_TAGS//,/ }; do
            npm dist-tag add "$PACKAGE_NAME@$PACKAGE_VERSION" "$dist_tag"
          done

      - name: Verify registry provenance metadata
        env:
          PACKAGE_NAME: ${{ needs.resolve.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for attempt in $(seq 1 36); do
            predicate_type="$(
              npm view "$PACKAGE_NAME@$PACKAGE_VERSION" \
                dist.attestations.provenance.predicateType \
                --prefer-online \
                2>/dev/null || true
            )"
            if [ "$predicate_type" = "https://slsa.dev/provenance/v1" ]; then
              echo "Verified provenance for $PACKAGE_NAME@$PACKAGE_VERSION"
              exit 0
            fi
            echo "Registry metadata is not public yet (attempt $attempt/36)."
            sleep 5
          done
          echo "Published package did not expose provenance metadata within three minutes."
          exit 1

      - name: Verify fresh registry consumer
        run: >-
          node scripts/verify-registry-consumer.mjs
          --package-name "${{ needs.resolve.outputs.package_name }}"
          --version "${{ needs.resolve.outputs.version }}"
          --channel "${{ needs.resolve.outputs.channel }}"
