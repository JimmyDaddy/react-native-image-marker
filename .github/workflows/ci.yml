name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:

  security:
    runs-on: ubuntu-latest
    name: Security & Dependency Review
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  architecture-compatibility:
    runs-on: ubuntu-latest
    name: Architecture Compatibility Test
    strategy:
      matrix:
        node-version: [18, 20]
        architecture: [legacy, new]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compilation
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --run

      - name: Test architecture detection
        run: |
          if [ "${{ matrix.architecture }}" = "new" ]; then
            echo "Testing new architecture detection..."
            export RCT_NEW_ARCH_ENABLED=1
            npm test -- --run --testNamePattern="Architecture detection"
          else
            echo "Testing legacy architecture detection..."
            export RCT_NEW_ARCH_ENABLED=0
            npm test -- --run --testNamePattern="Architecture detection"
          fi

      - name: Test build configuration
        run: npm test -- --run --testNamePattern="Property 6"

      - name: Validate Codegen specs
        run: |
          if [ -f "specs/NativeImageMarker.ts" ]; then
            echo "✅ Codegen spec file exists"
            npx tsc --noEmit specs/NativeImageMarker.ts
          else
            echo "❌ Codegen spec file missing"
            exit 1
          fi

      - name: Check package.json configuration
        run: |
          if grep -q "codegenConfig" package.json; then
            echo "✅ Package.json has codegenConfig"
          else
            echo "❌ Package.json missing codegenConfig"
            exit 1
          fi

      - name: Build library
        run: npm run prepack

      - name: Test library exports
        run: |
          node -e "
            const lib = require('./lib/commonjs/index.js');
            console.log('✅ Library exports:', Object.keys(lib));
            if (!lib.default) {
              console.error('❌ Default export missing');
              process.exit(1);
            }
            console.log('✅ Integration test passed');
          "

      - name: Verify architecture detection in built library
        run: |
          node -e "
            const { ArchitectureDetector } = require('./lib/commonjs/ArchitectureDetector.js');
            console.log('✅ ArchitectureDetector available');
            const isNewArch = ArchitectureDetector.isNewArchitecture();
            console.log('Architecture detection result:', isNewArch);
            console.log('✅ Architecture detection test passed');
          "

  validate-build-configs:
    runs-on: macos-latest
    name: Validate Build Configurations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Validate podspec syntax
        run: pod spec lint react-native-image-marker.podspec --allow-warnings

      - name: Test legacy architecture podspec
        run: |
          export RCT_NEW_ARCH_ENABLED=0
          pod spec lint react-native-image-marker.podspec --allow-warnings

      - name: Test new architecture podspec
        run: |
          export RCT_NEW_ARCH_ENABLED=1
          pod spec lint react-native-image-marker.podspec --allow-warnings

      - name: Validate Android Gradle syntax
        run: |
          cd android
          ./gradlew help

      - name: Test legacy architecture Android build
        run: |
          cd android
          echo "newArchEnabled=false" > gradle.properties
          ./gradlew build --dry-run

      - name: Test new architecture Android build
        run: |
          cd android
          echo "newArchEnabled=true" > gradle.properties
          ./gradlew build --dry-run

  install-dep:
    runs-on: macos-latest
    env:
      NO_FLIPPER: '1'
    name: Install dependencies
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Verify Dev Changed files
      uses: tj-actions/changed-files@v46
      id: verify-dev-changed-files
      with:
        files: |
          !*.md
          !*.MD
          !*.yml

    - uses: actions/cache@v4
      name: Cache node_modules
      id: cache-node-modules
      if: steps.verify-dev-changed-files.outputs.any_changed == 'true'
      with:
        path: |
          node_modules
          example/node_modules
        key: ${{ runner.os }}-nodeModules-${{ hashFiles('package.json') }}-${{ hashFiles('example/package.json') }}
        restore-keys: |
          ${{ runner.os }}-nodeModules-

    - name: Set up Ruby
      if: steps.verify-dev-changed-files.outputs.any_changed == 'true'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Setup node
      if: steps.verify-dev-changed-files.outputs.any_changed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true' && steps.verify-dev-changed-files.outputs.any_changed == 'true'
      run: |
        ls
        pwd
        npm install
        cd example
        ls
        pwd
        npm install

  android-build:
    runs-on: macos-latest
    name: Android Build
    needs: install-dep
    strategy:
      matrix:
        architecture: [legacy, new]
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Verify Android Changed files
      uses: tj-actions/changed-files@v46
      id: verify-android-changed-files
      with:
        files: |
          android/**
          src/**
          assets/**
          package.json
          !example/ios/**
          example/e2e/**

    - uses: actions/cache@v4
      name: Cache node_modules
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      id: cache-node-modules
      with:
        path: |
          node_modules
          example/node_modules
        key: ${{ runner.os }}-nodeModules-${{ hashFiles('package.json') }}-${{ hashFiles('example/package.json') }}
        restore-keys: |
          ${{ runner.os }}-nodeModules-

    - uses: actions/cache@v4
      id: cache-gradle
      name: Cache Gradle dependencies
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ matrix.architecture }}-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/src/**/*.kt') }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ matrix.architecture }}-
          ${{ runner.os }}-gradle-

    - name: Setup node
      uses: actions/setup-node@v4
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      with:
        node-version: '20'

    - name: Set up JDK
      uses: actions/setup-java@v4
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Configure Architecture
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/android
        if [ "${{ matrix.architecture }}" = "new" ]; then
          echo "newArchEnabled=true" >> gradle.properties
          echo "hermesEnabled=true" >> gradle.properties
        else
          echo "newArchEnabled=false" >> gradle.properties
          echo "hermesEnabled=false" >> gradle.properties
        fi
        cat gradle.properties

    - name: Install Gradle dependencies
      if: steps.cache-gradle.outputs.cache-hit != 'true' && steps.verify-android-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/android
        ./gradlew build --stacktrace

    - name: Run unit tests
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/android
        ./gradlew test --stacktrace

    - name: Build APK
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      run: |
        npm run prepack
        cd example/android
        ./gradlew assembleRelease
        mv app/build/outputs/apk/release/app-release.apk app-release-${{ matrix.architecture }}-${{ github.sha }}.apk

    - name: Upload APK
      if: steps.verify-android-changed-files.outputs.any_changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-${{ matrix.architecture }}-${{ github.sha }}.apk
        path:  ${{ github.workspace }}/example/android/app-release-${{ matrix.architecture }}-${{ github.sha }}.apk

  android-api-level-test:
    runs-on: macos-14
    needs: android-build
    name: Android Test
    strategy:
      matrix:
        api-level: [24, 31]
        target: [default]
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Verify Android Changed files
        uses: tj-actions/changed-files@v46
        id: verify-android-changed-files
        with:
          files: |
            android/**
            src/**
            assets/**
            package.json
            !example/ios/**
            example/e2e/**

      - uses: actions/cache@v4
        name: Cache node_modules
        if: steps.verify-android-changed-files.outputs.any_changed == 'true'
        id: cache-node-modules
        with:
          path: |
            node_modules
            example/node_modules
          key: ${{ runner.os }}-nodeModules-${{ hashFiles('package.json') }}-${{ hashFiles('example/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nodeModules-

      - uses: actions/cache@v4
        name: Cache Gradle dependencies
        if: steps.verify-android-changed-files.outputs.any_changed == 'true'
        id: cache-gradle
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('android/src/**/*.kt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup node
        uses: actions/setup-node@v4
        if: steps.verify-android-changed-files.outputs.any_changed == 'true'
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        if: steps.verify-android-changed-files.outputs.any_changed == 'true'
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        if: steps.verify-android-changed-files.outputs.any_changed == 'true'
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_5
          script: |
            cd example/android && ./gradlew connectedCheck  --stacktrace

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: steps.verify-android-changed-files.outputs.any_changed == 'true'
        with:
          name: Test-Reports
          path:  ${{ github.workspace }}/example/android/app/build/reports

  ios-build-test:
    runs-on: macos-latest
    env:
      NO_FLIPPER: '1'
    needs: install-dep
    name: iOS Build and Test
    strategy:
      matrix:
        cocoapods: ['1.14.3', '1.15.2']
        architecture: [legacy, new]
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Verify iOS Changed files
      uses: tj-actions/changed-files@v46
      id: verify-iOS-changed-files
      with:
        files: |
          ios/**
          src/**
          assets/**
          package.json
          !example/android/**
          example/e2e/**

    - uses: actions/cache@v4
      name: Cache node_modules
      id: cache-node-modules
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      with:
        path: |
          node_modules
          example/node_modules
        key: ${{ runner.os }}-nodeModules-${{ hashFiles('package.json') }}-${{ hashFiles('example/package.json') }}
        restore-keys: |
          ${{ runner.os }}-nodeModules-

    - name: Cache Pods
      id: cache-pods
      uses: actions/cache@v4
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      with:
        path: example/ios/Pods
        key: ${{ runner.os }}-pods-${{ matrix.cocoapods }}-${{ matrix.architecture }}-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-${{ matrix.cocoapods }}-${{ matrix.architecture }}-
          ${{ runner.os }}-pods-${{ matrix.cocoapods }}-
          ${{ runner.os }}-pods-

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Cocoapods
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      run: gem install cocoapods -v ${{ matrix.cocoapods }}

    - name: Setup node
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Configure Architecture
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/ios
        if [ "${{ matrix.architecture }}" = "new" ]; then
          export RCT_NEW_ARCH_ENABLED=1
          echo "RCT_NEW_ARCH_ENABLED=1" >> .xcode.env.local
        else
          export RCT_NEW_ARCH_ENABLED=0
          echo "RCT_NEW_ARCH_ENABLED=0" >> .xcode.env.local
        fi
        cat .xcode.env.local

    - name: Install Pods
      if: steps.cache-pods.outputs.cache-hit != 'true' && steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/ios
        pod cache clean --all
        if [ "${{ matrix.architecture }}" = "new" ]; then
          RCT_NEW_ARCH_ENABLED=1 pod install
        else
          RCT_NEW_ARCH_ENABLED=0 pod install
        fi

    - name: Install xcpretty
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      run: gem install xcpretty

    - name: Build
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/ios
        if [ "${{ matrix.architecture }}" = "new" ]; then
          RCT_NEW_ARCH_ENABLED=1 xcodebuild -workspace ImageMarkerExample.xcworkspace -scheme ImageMarkerExample -configuration Release -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' | xcpretty
        else
          RCT_NEW_ARCH_ENABLED=0 xcodebuild -workspace ImageMarkerExample.xcworkspace -scheme ImageMarkerExample -configuration Release -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' | xcpretty
        fi

    - name: Test
      if: steps.verify-iOS-changed-files.outputs.any_changed == 'true'
      run: |
        cd example/ios
        if [ "${{ matrix.architecture }}" = "new" ]; then
          RCT_NEW_ARCH_ENABLED=1 xcodebuild -workspace ImageMarkerExample.xcworkspace -scheme ImageMarkerExample -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' test | xcpretty
        else
          RCT_NEW_ARCH_ENABLED=0 xcodebuild -workspace ImageMarkerExample.xcworkspace -scheme ImageMarkerExample -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' test | xcpretty
        fi

  ci-complete:
    name: Complete CI
    needs: [security, architecture-compatibility, validate-build-configs, android-build, android-api-level-test, ios-build-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all job status
        if: >-
          ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: Report Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "🎉 All CI tests passed!"
          echo "✅ Security checks passed"
          echo "✅ Architecture compatibility validated"
          echo "✅ Build configurations validated"
          echo "✅ Android builds and tests passed"
          echo "✅ iOS builds and tests passed"
