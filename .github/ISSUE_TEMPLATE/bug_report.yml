name: Bug report
description: Report a reproducible Core 2 or optional Editor problem.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include a minimal reproduction. Image rendering bugs are difficult to diagnose from screenshots alone.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - react-native-image-marker (Core)
        - react-native-image-marker-editor (optional Editor)
        - Both Core and Editor
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web / React Native Web
        - Node.js Trace Runtime
        - Expo development build
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include Core, optional Editor, React Native, Expo (if used), and browser versions.
      placeholder: react-native-image-marker 2.1.0; react-native-image-marker-editor 0.3.0; React Native 0.86.0
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: React Native architecture
      options:
        - New Architecture
        - Legacy Architecture
        - Web / not applicable
        - Not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link a repository or paste the smallest Marker call that reproduces the problem.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the full error and relevant native, Metro, or browser console logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: image_details
    attributes:
      label: Image details
      description: Source type, dimensions, format, orientation, transparency, and whether the URL permits CORS.
  - type: textarea
    id: recipe_details
    attributes:
      label: Recipe / Editor details
      description: If applicable, include the minimal Recipe v2, sourceSize, preview maxSize, custom renderLayer behavior, and whether the issue appears in the editor canvas, Core preview, original export, or all three.
  - type: textarea
    id: invisible_details
    attributes:
      label: Invisible watermark details
      description: If applicable, include original dimensions, encoding/transform chain, strength, search mode, main thread vs Worker/server runtime, and whether a sanitized sample can be shared safely. Never include the production key.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I rebuilt the native app after installing or upgrading the package.
          required: true
        - label: I have removed private images, credentials, and personal information from the reproduction.
          required: true
