name: Setup Node
description: Configure the repository Node.js version and npm download cache

inputs:
  node-version:
    description: Node.js version; defaults to the repository CI baseline
    required: false
    default: '22.22.0'
  cache-dependency-path:
    description: Lockfile path or multiline lockfile paths used by setup-node
    required: false
    default: package-lock.json

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
