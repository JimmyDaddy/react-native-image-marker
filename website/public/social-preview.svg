<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">React Native Image Marker</title>
  <desc id="desc">Visible and invisible image watermarks for iOS, Android, and the web.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151924"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(262 308) rotate(33) scale(430 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3156d9" stop-opacity=".26"/>
      <stop offset="1" stop-color="#3156d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ea6ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <mask id="frame-window">
      <rect width="512" height="512" fill="white"/>
      <rect x="112" y="112" width="288" height="256" rx="28" fill="black"/>
    </mask>
    <mask id="target-gap">
      <rect width="512" height="512" fill="white"/>
      <circle cx="386" cy="386" r="94" fill="black"/>
    </mask>
    <mask id="target-rings">
      <rect width="512" height="512" fill="black"/>
      <circle cx="386" cy="386" r="76" fill="white"/>
      <circle cx="386" cy="386" r="42" fill="black"/>
      <circle cx="386" cy="386" r="21" fill="white"/>
    </mask>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#blue-glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M48 48h1104v534H48z" fill="none" stroke="#8ea6ff" stroke-opacity=".14"/>

  <g transform="translate(78 153) scale(.62)" filter="url(#shadow)">
    <rect x="18" y="18" width="476" height="476" rx="104" fill="#fff4e8"/>
    <g fill="#3156d9" mask="url(#target-gap)">
      <rect x="64" y="64" width="384" height="384" rx="64" mask="url(#frame-window)"/>
      <circle cx="166" cy="184" r="31"/>
      <path d="M88 376 181 281a14 14 0 0 1 20 0l43 44 76-82a14 14 0 0 1 21 0l83 88v93H88Z"/>
    </g>
    <rect width="512" height="512" fill="#e95e70" mask="url(#target-rings)"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="448" y="126" fill="#ff7f8b" font-size="18" font-weight="750" letter-spacing="3.4">OPEN SOURCE · ON-DEVICE</text>
    <text x="448" y="218" fill="#f7f8fc" font-size="62" font-weight="760" letter-spacing="-2.8">React Native</text>
    <text x="448" y="292" fill="#f7f8fc" font-size="62" font-weight="760" letter-spacing="-2.8">Image Marker</text>
    <text x="448" y="350" fill="#aeb7cb" font-size="24" font-weight="450">Visible and invisible image watermarks</text>
    <text x="448" y="386" fill="#aeb7cb" font-size="24" font-weight="450">for iOS, Android, and the web.</text>

    <g font-size="16" font-weight="650">
      <g transform="translate(448 431)">
        <rect width="112" height="42" rx="21" fill="#3156d9" fill-opacity=".25" stroke="#8ea6ff" stroke-opacity=".42"/>
        <text x="56" y="27" fill="#e3e9ff" text-anchor="middle">TEXT</text>
      </g>
      <g transform="translate(572 431)">
        <rect width="116" height="42" rx="21" fill="#3156d9" fill-opacity=".25" stroke="#8ea6ff" stroke-opacity=".42"/>
        <text x="58" y="27" fill="#e3e9ff" text-anchor="middle">LOGOS</text>
      </g>
      <g transform="translate(700 431)">
        <rect width="134" height="42" rx="21" fill="#3156d9" fill-opacity=".25" stroke="#8ea6ff" stroke-opacity=".42"/>
        <text x="67" y="27" fill="#e3e9ff" text-anchor="middle">TILED</text>
      </g>
      <g transform="translate(846 431)">
        <rect width="168" height="42" rx="21" fill="#e95e70" fill-opacity=".18" stroke="#ff7f8b" stroke-opacity=".5"/>
        <text x="84" y="27" fill="#ffe2e5" text-anchor="middle">TRACE IDS</text>
      </g>
    </g>

    <text x="448" y="538" fill="#8ea6ff" font-size="19" font-weight="650">image-marker.corerobin.com</text>
  </g>
</svg>
